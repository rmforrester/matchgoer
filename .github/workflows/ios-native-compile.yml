name: Matchgoer unsigned iOS compilation gate
on:
  push:
    branches: [validation/ios-native-compilation-20261028]
permissions:
  contents: read
concurrency:
  group: matchgoer-ios-native-gate
  cancel-in-progress: true
jobs:
  compile:
    # Standard public-repository runner, not a paid larger runner/custom image.
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: validation/ios-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile existing bundled project without signing or running the app
        shell: bash
        run: bash compile-simulator.sh native-input.zip
      - name: Retain compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-ios-compilation-evidence
          path: validation/ios-native/evidence/
          retention-days: 1
          if-no-files-found: warn
