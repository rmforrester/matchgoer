name: Canonical ancestry setup correction
on:
  push:
    branches: [validation/canonical-production-20261124]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 59eaef1b257afdb1aee81b6b0485b7f7d537d34d
          persist-credentials: false
          fetch-depth: 0
      - name: Rerun only the four existing ancestry tests on the Git-equipped runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 59eaef1b257afdb1aee81b6b0485b7f7d537d34d
          command -v git
          python3 scripts/production_source_guard.py 59eaef1b257afdb1aee81b6b0485b7f7d537d34d
          mkdir -p validation-output
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tests:. python3 - <<'PY' 2>&1 | tee validation-output/ancestry-tests.log
          import json
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName('test_production_source.AncestryGuard')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          summary = dict(tests=result.testsRun, failures=len(result.failures),
                         errors=len(result.errors), skipped=len(result.skipped),
                         passed=result.wasSuccessful(),
                         source='59eaef1b257afdb1aee81b6b0485b7f7d537d34d')
          with open('validation-output/ancestry-result.json', 'w') as f:
              json.dump(summary, f, indent=2)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 4 and not result.skipped else 1)
          PY
      - name: Retain bounded ancestry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-ancestry-correction
          path: validation-output/
          retention-days: 7
          if-no-files-found: error
